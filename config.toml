# GZW Scraper Configuration
# Paths are relative to the project root (where config.toml is located).

[wiki]
api_url = "https://gray-zone-warfare.fandom.com/api.php"
user_agent = "GZW-Scraper/4.5.0 (community tool; github.com/ZoniBoy00/gzw-scraper; scraper@gzw-data.dev)"

[scraper]
# Maximum retries for API calls and page fetches
max_retries = 5
# Base delay (seconds) for exponential backoff
base_delay = 1.0
# Delay between page scrapes (seconds) — be nice to the wiki
page_delay = 0.8
# Global minimum interval between ANY two HTTP requests (seconds).
# The wiki rate-limits aggressively (HTTP 429) when scraped in parallel,
# so all threads share this single throttle.
request_interval = 0.5
# Preserve a previously observed field through one partial parser run, then
# drop it if the omission repeats on the next successful run.
field_preservation_min_coverage = 0.5
max_stale_field_runs = 2
# If item count drops more than this fraction from previous scrape, abort the save
max_safe_deviation = 0.7
# Max items per API call
category_page_limit = 500
# Parallel category workers (lower = gentler on the wiki)
max_workers = 3

[output]
# Directory for scraped JSON files
directory = "data"
# Backup directory for previous data
backup_directory = "data_backup"

[skip_categories]
# Wiki-internal categories that should never be scraped
infrastructure = [
    "Images", "Image", "Videos", "Video", "Audio", "Audio files",
    "Templates", "Template", "Template documentation",
    "Users", "User", "User blog", "User blog comment",
    "Blog posts", "Blog listing", "Blog feed",
    "Files", "File",
    "Pages", "Pages with",
    "Articles", "Stubs", "Disambiguation",
    "Candidates for deletion", "Protected pages",
    "Infobox templates", "Navigation templates",
    "Featured articles", "Good articles",
    "Pages with broken file links",
    "Categories", "Category",
    "Need images", "Pages with missing images",
    "Pages with unavailable images",
    "Redlinks", "Broken redirects",
    "Community", "Help",
    "Real world", "Staff", "Administration",
    "Screenshots", "Concept art",
    "Gameplay", "Multiplayer",
    "Documentation templates",
    "Notice templates",
    "Image license templates",
    "Pages missing details",
    "Images needing improvement",
    "Citation needed",
    "Verification needed",
    "Archive",
    "Maps",
    "Gray Zone Warfare Wiki",
    "Evidence",
    "Newspapers",
    # Auto-discovered leaks from run — wiki infrastructure
    "Front page", "Basics", "Characters", "Locations", "Media",
    "Maintenance", "Your locker",
    # Template families (catch-all)
    "Navbox templates", "Section formatting templates",
    "Formatting templates", "General wiki templates",
    "Auxiliary templates", "Design template", "Quote templates",
    "Link Template", "Infobox templates", "Documentation templates",
    "Notice templates", "Image license templates",
    # Wiki technical
    "Noindexed pages", "Wiki skin images", "Wiki maintenance",
    "Front page sections",
    "Pages using duplicate arguments in template calls",
    "Image and media templates",
    "Pages missing details",
    "Candidates for deletion",
    # NOTE: "Removed Content" and "Upcoming Content" ARE scraped — they contain
    # real items/weapons that were removed from or are coming to the game
    # (removed_content.json / upcoming_content.json).
    "Patches", "Player", "Systems",
    "Game System", "Game Systems", "Weapons camouflage",
    "Secure Lockboxes",
]

[skip_pages]
# Specific pages that are NOT items/missions even though they sit in a game
# category (redirects, index pages, lore articles). Scraper drops them by title.
titles = [
    "Intels",
    "Weapons camouflage",
    "Lockboxes",
]


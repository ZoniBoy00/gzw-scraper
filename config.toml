[listing_pages]
# Wiki list pages whose tables enrich one or more dataset outputs.
# Some datasets combine these table rows with individual category pages.
loot_items = "Loot"
apparel_items = "Apparel"
provisions = "Provisions"
vests = "Armor Vests"
plate_carriers = "Plate Carriers"

[listing_page_fields]
# Read the protection rating and listing-page icon from both armor master lists.
# Preserve the rest of each item's category/infobox data.
vests = ["protection_rating", "nij_class", "material", "armor_locations", "image"]
plate_carriers = ["protection_rating", "nij_class", "material", "armor_locations", "image"]

[listing_page_only]
# These dataset keys are populated from their listing table instead of a wiki
# category page; keep this explicit so enrichment tables do not hide page data.
datasets = ["provisions"]

[category_index_pages]
# The category is singular on the wiki, but its index article uses the plural.
"Armor Vest" = "Armor Vests"

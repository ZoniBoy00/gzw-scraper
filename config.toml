# GZW Scraper Configuration
# Paths are relative to the project root (where config.toml is located).

[wiki]
api_url = "https://gray-zone-warfare.fandom.com/api.php"
user_agent = "GZW-Tools/3.0 (community tool; github.com/ZoniBoy00/gzw-tools; scraper@gzw-data.dev)"

[scraper]
# Maximum retries for API calls and page fetches
max_retries = 3
# Base delay (seconds) for exponential backoff
base_delay = 1.0
# Delay between page scrapes (seconds) — be nice to the wiki
page_delay = 0.5
# If item count drops more than this fraction from previous scrape, flag it
max_safe_deviation = 0.7
# Max items per API call
category_page_limit = 500

[output]
# Directory for scraped JSON files
directory = "data"
# Backup directory for previous data
backup_directory = "data_backup"

[skip_categories]
# Wiki-internal categories that should never be scraped
infrastructure = [
    "Images", "Image", "Videos", "Video", "Audio", "Audio files",
    "Templates", "Template", "Template documentation",
    "Users", "User", "User blog", "User blog comment",
    "Blog posts", "Blog listing", "Blog feed",
    "Files", "File",
    "Pages", "Pages with",
    "Articles", "Stubs", "Disambiguation",
    "Candidates for deletion", "Protected pages",
    "Infobox templates", "Navigation templates",
    "Featured articles", "Good articles",
    "Pages with broken file links",
    "Categories", "Category",
    "Need images", "Pages with missing images",
    "Pages with unavailable images",
    "Redlinks", "Broken redirects",
    "Community", "Help",
    "Real world", "Staff", "Administration",
    "Screenshots", "Concept art",
    "Gameplay", "Multiplayer",
    "Documentation templates",
    "Notice templates",
    "Image license templates",
    "Pages missing details",
    "Images needing improvement",
    "Citation needed",
    "Verification needed",
    "Archive",
    "Maps",
    "Removed Content",
    "Upcoming Content",
    "Newspaper",
    "Gray Zone Warfare Wiki",
    "Evidence",
    "Newspapers",
    "Factions",
    "Regions",
]


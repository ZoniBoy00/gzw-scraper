[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gzw-scraper"
dynamic = ["version"]
description = "Gray Zone Warfare wiki game-category data scraper"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "tqdm>=4.66",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.dynamic]
version = { attr = "gzw_scraper._version.__version__" }

[tool.setuptools.packages.find]
include = ["gzw_scraper*"]

[tool.setuptools.package-data]
"*" = ["config.toml"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]  # long lines are fine in parser tables and log strings

[tool.ruff.lint.per-file-ignores]
# scrape.py and the package __init__ re-export modules for backwards compatibility.
"scrape.py" = ["F401", "E402"]
"gzw_scraper/__init__.py" = ["F401"]

name: Scrape and Push to gzw-data

on:
  schedule:
    - cron: '17 6 * * 1'  # Every Monday at 06:17 UTC
  workflow_dispatch:       # Manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 lxml tqdm pytest 2>&1 | tail -5
          pip list 2>&1 | grep -E "requests|beautifulsoup|lxml|tqdm"

      - name: Run tests
        run: python -m pytest tests/ -v 2>&1

      # Pull previous data before scraping so failed categories are preserved.
      - name: Checkout gzw-data (previous data)
        uses: actions/checkout@v7
        with:
          repository: ZoniBoy00/gzw-data
          path: gzw-data
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Seed scraper data dir with previous data
        run: |
          mkdir -p data
          cp gzw-data/data/*.json data/ 2>/dev/null || true
          echo "Seeded $(ls data | wc -l) previous files"

      - name: Run scraper
        run: python scrape.py --all 2>&1 | tee scrape.log
        continue-on-error: false

      - name: Create scraper manifest
        run: python scripts/create_manifest.py

      - name: Generate data change report
        run: |
          python scripts/report_data_changes.py \
            --before gzw-data/data \
            --after data \
            --log scrape.log \
            --json-out scrape-report.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload scrape report
        uses: actions/upload-artifact@v7
        with:
          name: scrape-report-${{ github.run_number }}
          path: |
            scrape-report.json
            scrape.log
          retention-days: 30

      - name: Validate reviewed-data handoff inputs
        run: |
          test -s data/_manifest.json
          python -c "import json; m=json.load(open('data/_manifest.json')); assert m['source'] == 'gzw-scraper'; assert m['datasets']"
          python -c "import json; r=json.load(open('scrape-report.json')); assert 'files' in r and 'totals' in r and 'log' in r"
          echo "✅ Manifest and scrape report are ready for gzw-data handoff"

      # No pruning: if a category failed, the previous version stays intact.
      - name: Copy data to gzw-data/data/
        run: |
          DST="gzw-data/data"
          mkdir -p "$DST"
          for f in data/*.json; do
            name=$(basename "$f")
            cp "$f" "$DST/$name"
            echo "  ✅ $name"
          done
          echo "→ Stale-file pruning disabled: missing datasets keep previous data"

      - name: Record gzw-data snapshot
        run: node gzw-data/scripts/record-snapshot.js

      - name: Validate copied data
        run: |
          cd gzw-data
          ERROR=0
          for f in data/*.json; do
            if ! python -c "import json; json.load(open('$f'))" 2>/dev/null; then
              echo "  ❌ Invalid JSON: $f"
              ERROR=1
            fi
          done
          if [ "$ERROR" -eq 1 ]; then
            echo "Data validation failed — aborting push"
            exit 1
          fi
          echo "✅ All JSON files valid"

      - name: Commit and push
        run: |
          cd gzw-data
          git config user.name "gzw-bot"
          git config user.email "bot@gzw-data.dev"
          if git status --porcelain data/ | grep -q .; then
            git add data/
            git commit -m "auto: update scraped data ($(date +%Y-%m-%d))"
            git push
            echo "✅ Pushed to gzw-data"
          else
            echo "No data changes."
          fi

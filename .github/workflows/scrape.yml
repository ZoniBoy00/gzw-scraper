name: Scrape and Push to gzw-data

on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday at 06:00 UTC
  workflow_dispatch:       # Manual trigger

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests beautifulsoup4 lxml tqdm pytest 2>&1 | tail -5
          pip list 2>&1 | grep -E "requests|beautifulsoup|lxml|tqdm"

      - name: Run tests
        run: python -m pytest tests/ -v 2>&1

      # ── Pull previous data BEFORE scraping ──
      # This serves two purposes:
      #   1. The scraper's >70% drop-guard (safe_save) can compare against the
      #      previous run and ABORT writing when a category collapsed due to a
      #      scrape failure (rate limit, wiki hiccup) instead of destroying it.
      #   2. Files the scraper fails to produce keep their previous version —
      #      there is NO pruning step anymore. Data never silently disappears.
      - name: Checkout gzw-data (previous data)
        uses: actions/checkout@v7
        with:
          repository: ZoniBoy00/gzw-data
          path: gzw-data
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Seed scraper data dir with previous data
        run: |
          mkdir -p data
          cp gzw-data/data/*.json data/ 2>/dev/null || true
          echo "Seeded $(ls data | wc -l) previous files"

      - name: Run scraper
        run: python scrape.py --all 2>&1 | tee scrape.log
        continue-on-error: false

      - name: Generate data change report
        run: |
          python scripts/report_data_changes.py \
            --before gzw-data/data \
            --after data \
            --log scrape.log \
            --json-out scrape-report.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload scrape report
        uses: actions/upload-artifact@v7
        with:
          name: scrape-report-${{ github.run_number }}
          path: |
            scrape-report.json
            scrape.log
          retention-days: 30

      # ── Copy data to gzw-data/data/ ──
      # No pruning: if the scraper did not produce a file (category fetch
      # failed / wiki hiccup), the previous version stays untouched.
      - name: Copy data to gzw-data/data/
        run: |
          DST="gzw-data/data"
          mkdir -p "$DST"
          for f in data/*.json; do
            name=$(basename "$f")
            cp "$f" "$DST/$name"
            echo "  ✅ $name"
          done
          echo "→ Stale-file pruning disabled: missing datasets keep previous data"

      - name: Record gzw-data snapshot
        run: node scripts/record-snapshot.js

      - name: Validate copied data
        run: |
          cd gzw-data
          ERROR=0
          for f in data/*.json; do
            if ! python -c "import json; json.load(open('$f'))" 2>/dev/null; then
              echo "  ❌ Invalid JSON: $f"
              ERROR=1
            fi
          done
          if [ "$ERROR" -eq 1 ]; then
            echo "Data validation failed — aborting push"
            exit 1
          fi
          echo "✅ All JSON files valid"

      - name: Commit and push
        run: |
          cd gzw-data
          git config user.name "gzw-bot"
          git config user.email "bot@gzw-data.dev"
          if git status --porcelain data/ | grep -q .; then
            git add data/
            git commit -m "auto: update scraped data ($(date +%Y-%m-%d))"
            git push
            echo "✅ Pushed to gzw-data"
          else
            echo "No data changes."
          fi
